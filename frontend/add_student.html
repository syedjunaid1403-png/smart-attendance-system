<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-graduation-cap me-2"></i>SmartAttendance</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="students.html"><i class="fa-solid fa-users me-1"></i> Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="attendance.html"><i class="fa-solid fa-clipboard-user me-1"></i> Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fa-solid fa-file-contract me-1"></i> Reports</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 main-content">
        <div id="alert-container"></div>
        
        <div class="row justify-content-center fade-in-up">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white p-4 border-0">
                        <h4 class="mb-0 fw-bold"><i class="fa-solid fa-user-plus me-2"></i> Add New Student</h4>
                    </div>
                    <div class="card-body p-5">
                        <form id="add-student-form">
                            <div class="mb-4">
                                <label for="name" class="form-label fw-semibold text-muted">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="name" name="name" required placeholder="e.g. Jane Doe">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="department" class="form-label fw-semibold text-muted">Department</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-building text-muted"></i></span>
                                    <select class="form-select border-start-0 ps-0" id="department" name="department" required>
                                        <option value="" disabled selected>Select Department...</option>
                                        <option value="CSE">Computer Science (CSE)</option>
                                        <option value="ECE">Electronics (ECE)</option>
                                        <option value="EEE">Electrical (EEE)</option>
                                        <option value="MECH">Mechanical (MECH)</option>
                                        <option value="CIVIL">Civil (CIVIL)</option>
                                        <option value="IT">Information Tech (IT)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-5">
                                <label for="email" class="form-label fw-semibold text-muted">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" required placeholder="jane.doe@example.com">
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill hover-elevate">
                                    <i class="fa-solid fa-check me-2"></i> Save Student
                                </button>
                                <a href="students.html" class="btn btn-light btn-lg rounded-pill text-muted">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container"><p class="mb-0">© 2026 Smart Attendance Analytics System. All rights reserved.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
