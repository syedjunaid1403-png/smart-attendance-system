<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-graduation-cap me-2"></i>SmartAttendance</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="students.html"><i class="fa-solid fa-users me-1"></i> Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="attendance.html"><i class="fa-solid fa-clipboard-user me-1"></i> Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fa-solid fa-file-contract me-1"></i> Reports</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 main-content">
        <div id="alert-container"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4 fade-in-up">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-users text-primary me-2"></i> Student Management</h2>
            <a href="add_student.html" class="btn btn-primary rounded-pill shadow-sm hover-elevate">
                <i class="fa-solid fa-plus me-1"></i> Add Student
            </a>
        </div>

        <div class="card border-0 shadow-sm mb-4 fade-in-up" style="animation-delay: 0.1s;">
            <div class="card-body p-4">
                <form id="search-form" class="d-flex w-50 mb-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input id="search-input" class="form-control border-start-0 ps-0" type="search" placeholder="Search by name or department..." aria-label="Search">
                        <button class="btn btn-primary" type="submit">Search</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 custom-table">
                        <thead class="table-light text-muted">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Email</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-tbody">
                            <tr><td colspan="5" class="text-center py-5 text-muted">Loading students...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container"><p class="mb-0">© 2026 Smart Attendance Analytics System. All rights reserved.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
