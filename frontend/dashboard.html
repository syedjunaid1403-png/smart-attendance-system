<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-graduation-cap me-2"></i>SmartAttendance</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html"><i class="fa-solid fa-chart-pie me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="students.html"><i class="fa-solid fa-users me-1"></i> Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="attendance.html"><i class="fa-solid fa-clipboard-user me-1"></i> Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fa-solid fa-file-contract me-1"></i> Reports</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 main-content">
        <div id="alert-container"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4 fade-in-up">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-chart-pie text-primary me-2"></i> Analytics Dashboard</h2>
            <span class="badge bg-primary fs-6 px-3 py-2 rounded-pill shadow-sm"><i class="fa-regular fa-calendar me-1"></i> <span id="today-badge">Loading...</span></span>
        </div>

        <div class="row g-4 mb-5 fade-in-up" style="animation-delay: 0.1s;">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm kpi-card bg-primary text-white h-100">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="fw-normal mb-0 opacity-75">Total Students</h5>
                            <i class="fa-solid fa-users fs-3 opacity-50"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0 mt-3" id="kpi-total">...</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm kpi-card bg-success text-white h-100">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="fw-normal mb-0 opacity-75">Present Today</h5>
                            <i class="fa-solid fa-user-check fs-3 opacity-50"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0 mt-3" id="kpi-present">...</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm kpi-card bg-danger text-white h-100">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="fw-normal mb-0 opacity-75">Absent Today</h5>
                            <i class="fa-solid fa-user-xmark fs-3 opacity-50"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0 mt-3" id="kpi-absent">...</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm kpi-card bg-info text-white h-100">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="fw-normal mb-0 opacity-75">Overall %</h5>
                            <i class="fa-solid fa-percent fs-3 opacity-50"></i>
                        </div>
                        <h2 class="display-5 fw-bold mb-0 mt-3" id="kpi-percent">...</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4 fade-in-up" style="animation-delay: 0.2s;">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                        <h5 class="fw-bold"><i class="fa-solid fa-chart-bar text-primary me-2"></i> Department-wise Attendance</h5>
                    </div>
                    <div class="card-body p-4 text-center">
                        <img id="bar-chart" src="https://placehold.co/600x400/f8f9fa/a3a3a3?text=Loading..." class="img-fluid rounded" alt="Bar Chart" onerror="this.src='https://placehold.co/600x400/f8f9fa/a3a3a3?text=No+Data+Available'">
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                        <h5 class="fw-bold"><i class="fa-solid fa-chart-pie text-primary me-2"></i> Overall Attendance Ratio</h5>
                    </div>
                    <div class="card-body p-4 text-center">
                        <img id="pie-chart" src="https://placehold.co/600x400/f8f9fa/a3a3a3?text=Loading..." class="img-fluid rounded" alt="Pie Chart" onerror="this.src='https://placehold.co/600x400/f8f9fa/a3a3a3?text=No+Data+Available'">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container"><p class="mb-0">© 2026 Smart Attendance Analytics System. All rights reserved.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
