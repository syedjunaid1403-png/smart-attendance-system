<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-graduation-cap me-2"></i>SmartAttendance</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="students.html"><i class="fa-solid fa-users me-1"></i> Students</a></li>
                    <li class="nav-item"><a class="nav-link active" href="attendance.html"><i class="fa-solid fa-clipboard-user me-1"></i> Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fa-solid fa-file-contract me-1"></i> Reports</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 main-content">
        <div id="alert-container"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4 fade-in-up">
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-clipboard-user text-primary me-2"></i> Mark Attendance</h2>
        </div>

        <div class="card border-0 shadow-sm mb-4 fade-in-up" style="animation-delay: 0.1s;">
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-4 w-md-50">
                    <label for="date_select" class="form-label mb-0 me-3 fw-bold text-muted">Select Date:</label>
                    <input type="date" id="date_select" class="form-control w-auto">
                </div>

                <form id="attendance-form">
                    <div class="table-responsive mb-4">
                        <table class="table table-hover align-middle custom-table">
                            <thead class="table-light text-muted">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Name</th>
                                    <th>Department</th>
                                    <th class="text-center pe-4">Attendance Status</th>
                                </tr>
                            </thead>
                            <tbody id="attendance-tbody">
                                <tr><td colspan="4" class="text-center py-5 text-muted">Loading students...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="text-end">
                        <button type="submit" id="save-attendance-btn" class="btn btn-primary btn-lg rounded-pill px-5 shadow hover-elevate" style="display:none;">
                            <i class="fa-solid fa-save me-2"></i> Save Attendance
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container"><p class="mb-0">© 2026 Smart Attendance Analytics System. All rights reserved.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
